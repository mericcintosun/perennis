    <rect x="8" y="44" width="10" height="32"/>
    <rect x="28" y="38" width="10" height="44"/>
    <rect x="48" y="50" width="10" height="20"/>
    <rect x="68" y="34" width="10" height="52"/>
    <rect x="88" y="46" width="10" height="28"/>
    <rect x="148" y="42" width="10" height="36"/>
    <rect x="168" y="52" width="10" height="16"/>
    <rect x="188" y="36" width="10" height="48"/>
    <rect x="208" y="48" width="10" height="24"/>
    <rect x="228" y="44" width="10" height="32"/>
  </g>
  <g fill="#D2622F">
    <rect x="108" y="30" width="10" height="60"/>
